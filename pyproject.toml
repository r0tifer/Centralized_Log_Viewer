[tool.poetry]
name = "clv"
version = "3.0.0"
description = "Centralized Log Viewer Textual TUI"
readme = "README.md"
authors = ["Centralized Log Viewer Maintainers <maintainers@example.com>"]
packages = [
    { include = "clv" },
]
# The settings template ships with the wheel and the sdist, not only with the
# PyInstaller bundle. `bundled_config_path()` looks beside the package for it
# and `default_config_text()` falls back to DEFAULT_SETTINGS_TEMPLATE when it is
# missing -- so a pip install used to run off the fallback and depend on two
# files staying identical by hand. They are checked against each other by
# tests/test_config.py; shipping the real one means the check is not the only
# thing keeping them in step.
include = [
    { path = "settings.conf", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
# Widened from ^6.5.0: the app is developed and tested against 8.x, and the
# private-Textual-API coupling that made the old pin necessary is gone.
textual = ">=6.5,<9.0"
rich = ">=14.2.0"

[tool.poetry.group.dev.dependencies]
# Test-only. Previously declared as a runtime dependency, which shipped pytest
# into the wheel and the PyInstaller bundle.
pytest = "^9.0.2"

[tool.poetry.scripts]
clv = "clv.cli:main"
CentralizedLogViewer = "clv.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]
# The default run never touches a network. `remote_integration` is opt-in, is
# never part of a phase gate, and is the only thing that can actually catch a
# BusyBox `find` with no `-printf` or a BSD `stat` -- a fake runner will happily
# return whatever fixture it was given. Run it with:
#   pytest -m remote_integration
addopts = "-m 'not remote_integration'"
markers = [
    "remote_integration: needs a reachable SSH host (CLV_TEST_SSH_HOST); opt-in",
]

[build-system]
requires = ["poetry-core>=1.7.0"]
build-backend = "poetry.core.masonry.api"
