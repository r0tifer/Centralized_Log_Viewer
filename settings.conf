[log_viewer]

# ---------------------------------------------------------------------------
# Sources
# ---------------------------------------------------------------------------

# Folders and/or individual files to monitor, comma separated.
# Folders are searched recursively. CLV is NOT limited to *.log files: any
# readable text file is a valid source (syslog, .txt, .json, .out, rotated
# app.log.1, files with no extension at all). Use the glob options below to
# narrow that down.
#
# Examples:
#   log_dirs = /var/log
#   log_dirs = /var/log, /srv/app/logs, /home/me/debug/session.txt
log_dirs = /var/log

# Only list files matching these globs. Empty means "every readable text file".
# Globs are matched against the file name, the path relative to its root, and
# the absolute path, so both "*.log" and "nginx/*" work.
include_globs =

# Never list files matching these globs. The defaults keep archives and binary
# journals out, since neither can be displayed as text.
#
# .gz, .bz2 and .xz are NOT excluded: CLV decompresses those itself, which is
# what makes the rotated half of /var/log reachable. .zst is excluded because
# there is no decompressor for it in the Python standard library, and adding
# one would be CLV's first new runtime dependency.
#
# *.pdf is here for a different reason: its text is extractable, but only as
# reflowed prose with no line structure, timestamps or severity. Remove it if
# you want PDFs listed anyway.
exclude_globs = *.zst, *.zip, *.tar, *.tgz, *.journal, *.journal~, *.db, *.sqlite, *.sqlite3, *.pdf

# Follow symlinked directories while scanning. Cycles are detected and skipped.
follow_symlinks = false

# Skip files whose first block decodes to NUL characters (i.e. binaries). This
# is what keeps a stray database or core dump out of the tree without needing
# to list every possible extension above.
#
# The test is applied to characters, not raw bytes, so UTF-16 files (which is
# how Windows and PowerShell write their exports) are read as the text they
# are instead of being mistaken for binaries. Container documents CLV can
# extract - currently .ods - are listed regardless.
skip_binary = true

# Stop discovery after this many files, so pointing CLV at an enormous tree
# degrades into "showing the first N" instead of hanging.
max_files = 5000

# Present app.log, app.log.1 and app.log.2.gz as ONE source spanning all three,
# oldest lines first. Every member is still listed underneath the set node and
# can still be opened on its own.
#
# Only the live member is tailed; the rotated-out ones are read once, and only
# as far back as max_buffer_lines needs. A set whose newest member already
# fills the buffer costs nothing extra to open.
group_rotated = true

# ---------------------------------------------------------------------------
# Memory and display
# ---------------------------------------------------------------------------

# Lines held in memory per source. Older lines are dropped as new ones arrive.
# Opening a source reads backwards from the end of the file, so this is the
# real memory cost regardless of how large the file on disk is.
max_buffer_lines = 5000

# Lines shown when a source is first opened.
# Adjust at runtime with + / -.
default_show_lines = 500

# Floor for the visible-line window, and the step + / - moves by.
min_show_lines = 10
show_step = 50

# How often (in Hz) to check for new content. Lower uses less CPU.
refresh_hz = 2

# Starting width of the source tree, in columns. Resize at runtime with [ and ].
tree_width = 38

# Structured payload preview limits (used when "Structured" is enabled).
csv_max_rows = 20
csv_max_cols = 10

# Most log text a single 'y' (clipboard copy) may carry, in bytes.
#
# 'y' hands the text to the terminal as an OSC 52 escape sequence, which is what
# makes copying work over SSH and tmux where a mouse selection cannot. That
# sequence has no continuation form and no agreed size limit: tmux caps its
# passthrough at roughly 74 kB and most terminals drop an oversized sequence
# without saying so. The default stays under that with room for base64
# expansion, so anything that fits here is something the terminal will accept.
#
# A copy larger than the cap is truncated at a line boundary, keeping the newest
# lines, and the notification says how many were dropped - never a silent
# partial copy.
clipboard_max_bytes = 65536

# ---------------------------------------------------------------------------
# Watch rules
# ---------------------------------------------------------------------------

# A watch rule (managed with W) highlights matching lines as they arrive and
# can raise a notification. This is how long one rule waits, in seconds, before
# it may notify again; every match inside that window is counted and reported
# together, so a rule that matches everything produces one message a minute
# rather than one per line.
watch_rate_limit = 60

# Ring the terminal bell when a watch rule notifies.
#
# Off by default, and deliberately so: a bell is something an operator chooses,
# never something a log file does to them. Rules run in-process for the life of
# the session - there is no daemon, no desktop notification and no subprocess.
watch_bell = false

# ---------------------------------------------------------------------------
# Repeat clustering
# ---------------------------------------------------------------------------

# `c` collapses repeated lines into one row with a count. Two lines cluster
# when they look the same once the volatile tokens (numbers, UUIDs, IPs, hex,
# paths, quoted strings, timestamps) are normalised away.
#
# This is how far back, in entries, a cluster may reach to absorb a line that
# matches it. Raise it to collapse repeats that are widely separated; lower it
# to keep them as separate events. It is a bound rather than a preference: it
# is what stops one cluster spanning an entire session, and what keeps the cost
# linear in the size of the buffer.
#
# Collapsing never hides a line. Every clustered line is still selectable,
# markable and exportable, and Enter on a cluster row expands it in place.
cluster_lookback = 200

# ---------------------------------------------------------------------------
# The systemd journal
# ---------------------------------------------------------------------------

# Offer the systemd journal as a source: the whole journal, one node per
# .service unit, and one per boot.
#
# Off by default, and deliberately so. Reading the journal means running
# journalctl, and CLV does not spawn a subprocess unless you asked it to -
# which is also why the journal ships as a plugin rather than as part of core.
# With this false, nothing is spawned and nothing is enumerated.
#
# The Advanced drawer's "Journal (systemd)" switch turns this on and writes the
# change back to this file, so consent is given once rather than every launch.
# On a machine without systemd the switch is disabled and says why.
enable_journald = false

# ---------------------------------------------------------------------------
# Remote sources over SSH
# ---------------------------------------------------------------------------

# Read log folders on other machines, and have them behave like folders on this
# one: discovered recursively, listed in the tree, opened, tailed, filtered,
# starred, and merged with local logs in a single timestamp-ordered pane.
#
# Off by default, and for a stronger version of the journald reason above: a
# remote source spawns ssh, and a *network* subprocess raises the bar for
# asking rather than lowering it. With this false nothing connects and nothing
# is spawned, however many hosts are configured below.
enable_ssh = false

# One section per remote machine, named [ssh:<name>]. The name after "ssh:" is
# CLV's name for that machine: it is what the source tree shows and what
# `node:` matches in a query. It is also the address used to connect, unless a
# `host` line overrides it - so if the name is already a Host alias in your
# ~/.ssh/config, that is the whole configuration.
#
# Authentication is ssh-agent and key files only. CLV inherits your existing
# ~/.ssh/config wholesale - aliases, ProxyJump, per-host keys, known_hosts - so
# a host you can already reach by hand is a host CLV can read. A connection
# that would need typing anything is reported as unreachable rather than
# waiting for input.
#
# There is no password option, and there will not be one: CLV does not store or
# transmit a credential. Load your key into ssh-agent, or point identity_file
# at a key with no passphrase.
#
# There is no sudo option either. CLV reads as the configured SSH user and
# never escalates privilege, locally or remotely. If a log is unreadable, the
# answer is to add that user to the file's group (adm, systemd-journal) or to
# set an ACL on the path.
#
# Any option left out of a host section falls back to the global value above.
# max_files and max_buffer_lines are worth setting per host: one noisy machine
# should not consume the whole file allowance, and a slow link is the reason to
# pull less history on open.
#
# [ssh:web01]
# host = web01.internal
# user = ops
# port = 22
# identity_file = ~/.ssh/id_ed25519
# log_dirs = /var/log, /srv/app/logs
# include_globs = *.log, syslog*
# max_files = 2000
# max_buffer_lines = 2000
# correct_clock_skew = false
# enabled = true
#
# [ssh:db02]
# host = 10.0.0.12
# user = ops
# log_dirs = /var/log/postgresql
